name: CPU tests and artifact guard
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Reject tracked point clouds and large files
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = {'.ply', '.pcd', '.splat', '.npz', '.npy', '.pt', '.pth', '.mp4', '.mov'}
          bad = [p for p in files if p and (pathlib.Path(p).suffix.lower() in forbidden or pathlib.Path(p).stat().st_size > 5*1024*1024)]
          assert not bad, f'Artifacts must stay outside Git: {bad}'
          PY
